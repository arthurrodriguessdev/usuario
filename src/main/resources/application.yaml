spring:
  application:
    name: usuario

  datasource:
    url: jdbc:postgresql://localhost:5432/db_usuario
    username: postgres
    password: 1801

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080