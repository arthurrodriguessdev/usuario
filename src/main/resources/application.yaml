spring:
  application:
    name: usuario
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME]
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${PORTA_USUARIO}
client:
  url:
    viacep: ${URL_API_VIACEP}
secretKey: ${SECRET_KEY_JWT}